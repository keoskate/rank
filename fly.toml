# fly.toml — AI Broker Exchange Server deployment config.
# Generated 2026-05-21 for autonomous trading during laptop-closed periods.

app = "broker-exchange"
primary_region = "ewr"  # Newark — closest to NYSE for lowest latency
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  NODE_OPTIONS = "--openssl-legacy-provider"
  # Optional: set BROKER_PAPER_TRADING=off via `fly secrets set` to force-sim everything

# Persistent storage for data/ — sessions, broker versions, ledger, reports, logs.
# Without this, every redeploy would wipe all broker state.
[mounts]
  source = "broker_data"
  destination = "/app/data"
  initial_size = "3gb"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = false  # never stop — we trade 24/7 (well, market hours)
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "get"
    path = "/healthz"

# Small box — the engine is mostly I/O bound, not compute
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
