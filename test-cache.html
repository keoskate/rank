<!DOCTYPE html>
<html>
<head>
    <title>Cache Debug Test</title>
</head>
<body>
    <h1>Cache Debug Test</h1>
    <button onclick="checkCache()">Check Cache</button>
    <button onclick="clearAllCache()">Clear All Cache</button>
    <div id="output"></div>

    <script>
        function checkCache() {
            const output = document.getElementById('output');
            const allKeys = Object.keys(localStorage);
            const cacheKeys = allKeys.filter(key => key.startsWith('stonks_cache_'));
            
            output.innerHTML = '<h2>All localStorage keys:</h2>' + 
                              '<pre>' + JSON.stringify(allKeys, null, 2) + '</pre>' +
                              '<h2>Cache keys:</h2>' + 
                              '<pre>' + JSON.stringify(cacheKeys, null, 2) + '</pre>';
            
            if (cacheKeys.length > 0) {
                output.innerHTML += '<h2>Cache contents:</h2>';
                cacheKeys.forEach(key => {
                    const value = localStorage.getItem(key);
                    output.innerHTML += '<h3>' + key + '</h3><pre>' + value.substring(0, 500) + '...</pre>';
                });
            }
        }
        
        function clearAllCache() {
            const cacheKeys = Object.keys(localStorage).filter(key => key.startsWith('stonks_cache_'));
            cacheKeys.forEach(key => localStorage.removeItem(key));
            alert('Cleared ' + cacheKeys.length + ' cache entries');
        }
    </script>
</body>
</html>
